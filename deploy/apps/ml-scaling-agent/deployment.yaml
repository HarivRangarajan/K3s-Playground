apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-scaling-agent
  namespace: imdb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-scaler
  namespace: imdb
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-scaling-agent-binding
  namespace: imdb
subjects:
- kind: ServiceAccount
  name: ml-scaling-agent
  namespace: imdb
roleRef:
  kind: Role
  name: deployment-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-scaling-agent
  namespace: imdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-scaling-agent
  template:
    metadata:
      labels:
        app: ml-scaling-agent
    spec:
      serviceAccountName: ml-scaling-agent
      containers:
      - name: scaling-agent
        image: k3d-registry.localhost:5500/ml-scaling-agent:latest
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi" 